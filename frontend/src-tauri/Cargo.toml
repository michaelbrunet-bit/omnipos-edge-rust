[package]
name = "omnipos-tauri-shell"
version = "0.2.0"
description = "Cross-Platform Tauri v2 Shell (Linux, Windows, iOS, Android) for OmniPOS Edge"
edition = "2021"
license = "MIT"

# Standalone workspace so root `cargo test` runs pure-Rust backend crates without requiring WebView2 / GTK system headers
[workspace]

[lib]
name = "omnipos_tauri_shell"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "net", "macros"] }
axum = "0.7"
pos-storage = { path = "../../crates/pos-storage" }
pos-server = { path = "../../crates/pos-server" }
